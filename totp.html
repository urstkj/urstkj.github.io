    <script>
        // Base32 decoding
        function base32Decode(encoded) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            encoded = encoded.toUpperCase().replace(/[^A-Z2-7]/g, '');

            let bits = '';
            for (const char of encoded) {
                const val = alphabet.indexOf(char);
                if (val === -1) throw new Error('Invalid base32 character');
                bits += val.toString(2).padStart(5, '0');
            }

            const bytes = new Uint8Array(Math.floor(bits.length / 8));
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] = parseInt(bits.substr(i * 8, 8), 2);
            }
            return bytes;
        }

        // HMAC-SHA1 implementation
        async function hmacSha1(key, message) {
            const cryptoKey = await crypto.subtle.importKey(
                'raw',
                key,
                { name: 'HMAC', hash: 'SHA-1' },
                false,
                ['sign']
            );
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, message);
            return new Uint8Array(signature);
        }

        // Generate TOTP
        async function generateTOTP(secret, timeStep = 30, digits = 6) {
            const key = base32Decode(secret);
            const time = Math.floor(Date.now() / 1000 / timeStep);

            // Convert time to 8-byte big-endian buffer
            const timeBuffer = new ArrayBuffer(8);
            const timeView = new DataView(timeBuffer);
            timeView.setUint32(4, time, false);

            const hmac = await hmacSha1(key, new Uint8Array(timeBuffer));

            // Dynamic truncation
            const offset = hmac[hmac.length - 1] & 0x0f;
            const binary =
                ((hmac[offset] & 0x7f) << 24) |
                ((hmac[offset + 1] & 0xff) << 16) |
                ((hmac[offset + 2] & 0xff) << 8) |
                (hmac[offset + 3] & 0xff);

            const otp = binary % Math.pow(10, digits);
            return otp.toString().padStart(digits, '0');
        }

        // UI Elements
        const secretInput = document.getElementById('secret');
        const totpDisplay = document.getElementById('totp');
        const timerText = document.getElementById('timer');
        const progressBar = document.getElementById('progress');
        const errorDisplay = document.getElementById('error');

        let currentCode = '';

        // Update TOTP display
        async function updateTOTP() {
            const secret = secretInput.value.trim();
            errorDisplay.textContent = '';

            if (!secret) {
                totpDisplay.textContent = '------';
                timerText.textContent = 'Enter a secret key to generate TOTP';
                progressBar.style.width = '100%';
                return;
            }

            try {
                currentCode = await generateTOTP(secret);
                totpDisplay.textContent = currentCode;
            } catch (e) {
                totpDisplay.textContent = '------';
                errorDisplay.textContent = 'Invalid secret key';
                currentCode = '';
            }
        }

        // Update timer
        function updateTimer() {
            const now = Date.now() / 1000;
            const remaining = 30 - (Math.floor(now) % 30);
            const progress = (remaining / 30) * 100;

            if (secretInput.value.trim()) {
                timerText.textContent = `Refreshes in ${remaining}s`;
            }
            progressBar.style.width = `${progress}%`;

            // Regenerate code when timer hits 30
            if (remaining === 30) {
                updateTOTP();
            }
        }

        // Copy code to clipboard
        async function copyCode() {
            if (!currentCode) return;

            try {
                await navigator.clipboard.writeText(currentCode);
                totpDisplay.classList.add('copied');
                setTimeout(() => totpDisplay.classList.remove('copied'), 1000);
            } catch (e) {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = currentCode;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                totpDisplay.classList.add('copied');
                setTimeout(() => totpDisplay.classList.remove('copied'), 1000);
            }
        }

        // Event listeners
        secretInput.addEventListener('input', updateTOTP);

        // Initialize
        updateTOTP();
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
